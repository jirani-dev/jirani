# Executable mirror of AGENTS.md § Build & Test Commands (check variant), scoped to
# changed files. Backend lint/format/type/test config lives in backend/pyproject.toml;
# frontend lint lives in frontend/eslint.config.js, type in frontend/tsconfig.app.json.
# Docs-only PRs skip the test step (see "Detect docs-only change") — the job still
# runs so the required `quality` check always reports.
name: ci

on:
  pull_request:
    branches: [frontend, refactor, master]
  push:
    branches: [frontend, refactor, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Sync dependencies
        working-directory: backend
        run: uv sync

      - name: Resolve changed Python files
        id: py
        working-directory: backend
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.event.pull_request.base.ref }}...HEAD"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            range="${{ github.event.before }}...HEAD"
          else
            echo "Branch-creation push — no diff basis, skipping scoped checks"
            range=""
          fi
          if [ -n "$range" ]; then
            files=$(git diff --name-only --relative --diff-filter=d "$range" -- '*.py' | tr '\n' ' ' || true)
          else
            files=""
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Format check (changed files)
        if: steps.py.outputs.files != ''
        working-directory: backend
        run: uv run ruff format --check ${{ steps.py.outputs.files }}

      - name: Lint (changed files)
        if: steps.py.outputs.files != ''
        working-directory: backend
        run: uv run ruff check ${{ steps.py.outputs.files }}

      - name: Type check (changed files)
        if: steps.py.outputs.files != ''
        working-directory: backend
        run: |
          out="$(uv run mypy ${{ steps.py.outputs.files }} --strict || true)"
          echo "$out"
          errfiles="$(echo "$out" | grep "error:" | cut -d: -f1 | sort -u || true)"
          if [ -z "$errfiles" ]; then
            echo "No mypy errors at all"
            exit 0
          fi
          bad=""
          for f in ${{ steps.py.outputs.files }}; do
            if echo "$errfiles" | grep -qx "$f"; then
              bad="$bad $f"
            fi
          done
          if [ -n "$bad" ]; then
            echo "::error::mypy errors in changed files:$bad"
            exit 1
          fi
          echo "::warning::mypy debt in transitively-imported untouched files: $errfiles"

      - name: Detect docs-only change
        id: docs
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          range="origin/${{ github.event.pull_request.base.ref }}...HEAD"
          if git diff --name-only --diff-filter=d "$range" | grep -qvE '(^docs/.*)|(\.md$)'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tests (testcontainers Postgres)
        if: steps.docs.outputs.docs_only != 'true'
        working-directory: backend
        run: uv run pytest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve changed frontend files
        id: front
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.event.pull_request.base.ref }}...HEAD"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            range="${{ github.event.before }}...HEAD"
          else
            echo "Branch-creation push — no diff basis, skipping scoped checks"
            range=""
          fi
          if [ -n "$range" ] && [ -n "$(git diff --name-only --diff-filter=d "$range" -- 'frontend/**' || true)" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install frontend dependencies (npm ci)
        if: steps.front.outputs.has == 'true'
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        if: steps.front.outputs.has == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Frontend type check
        if: steps.front.outputs.has == 'true'
        working-directory: frontend
        run: npx tsc --noEmit

      # vitest run steps added when vitest lands (2026-09-15 deferral)

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile .

      - name: Build frontend image (when Dockerfile exists)
        if: hashFiles('frontend/Dockerfile') != ''
        run: docker build -f frontend/Dockerfile .
