# Executable mirror of AGENTS.md § Build & Test Commands (check variant), scoped to
# changed Python files. Lint/format/type config lives in backend/pyproject.toml.
# Docs-only PRs skip the test step (see "Detect docs-only change") — the job still
# runs so the required `quality` check always reports.
name: ci

on:
  pull_request:
    branches: [refactor, master]
  push:
    branches: [refactor, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Sync dependencies
        working-directory: backend
        run: uv sync

      - name: Resolve changed Python files
        id: py
        working-directory: backend
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.event.pull_request.base.ref }}...HEAD"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            range="${{ github.event.before }}...HEAD"
          else
            echo "Branch-creation push — no diff basis, skipping scoped checks"
            range=""
          fi
          if [ -n "$range" ]; then
            files=$(git diff --name-only --relative --diff-filter=d "$range" -- '*.py' | tr '\n' ' ' || true)
          else
            files=""
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Format check (changed files)
        if: steps.py.outputs.files != ''
        working-directory: backend
        run: uv run ruff format --check ${{ steps.py.outputs.files }}

      - name: Lint (changed files)
        if: steps.py.outputs.files != ''
        working-directory: backend
        run: uv run ruff check ${{ steps.py.outputs.files }}

      - name: Type check (changed files)
        if: steps.py.outputs.files != ''
        working-directory: backend
        run: |
          out="$(uv run mypy ${{ steps.py.outputs.files }} --strict || true)"
          echo "$out"
          errfiles="$(echo "$out" | grep "error:" | cut -d: -f1 | sort -u || true)"
          if [ -z "$errfiles" ]; then
            echo "No mypy errors at all"
            exit 0
          fi
          bad=""
          for f in ${{ steps.py.outputs.files }}; do
            if echo "$errfiles" | grep -qx "$f"; then
              bad="$bad $f"
            fi
          done
          if [ -n "$bad" ]; then
            echo "::error::mypy errors in changed files:$bad"
            exit 1
          fi
          echo "::warning::mypy debt in transitively-imported untouched files: $errfiles"

      - name: Detect docs-only change
        id: docs
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          range="origin/${{ github.event.pull_request.base.ref }}...HEAD"
          if git diff --name-only --diff-filter=d "$range" | grep -qvE '(^docs/.*)|(\.md$)'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tests (testcontainers Postgres)
        if: steps.docs.outputs.docs_only != 'true'
        working-directory: backend
        run: uv run pytest

      - name: Coverage on changed Python files
        if: steps.py.outputs.files != '' && steps.docs.outputs.docs_only != 'true'
        working-directory: backend
        run: |
          uv run coverage run --branch -m pytest -q
          # git diff lists paths relative to repo root (e.g. backend/app/...); coverage
          # runs from working-directory backend/ and matches patterns relative to it.
          include=$(echo "${{ steps.py.outputs.files }}" | tr ' ' ',' | sed 's|^backend/||g')
          uv run coverage report --include="$include" --fail-under=80 --show-missing

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile .
