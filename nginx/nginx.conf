server {
    listen 80;
    server_name _;

    # Ceiling for every upload request. The API additionally caps books at
    # MAX_UPLOAD_SIZE (50MB, backend/app/config.py); audio and video have no
    # limit of their own, so this value is their effective maximum. A larger
    # body is answered here with 413 and never reaches the API.
    client_max_body_size 60m;

    location = /api {
        return 302 /api/;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Public: book covers and video posters (the cover_url / poster_url the
    # API returns). Safe to cache for a day because a replaced cover is stored
    # under a new file name, never written over the old one.
    location /static/covers/ {
        alias /srv/uploads/covers/;
        add_header Cache-Control "public, max-age=86400";
    }

    # Internal: reachable ONLY via X-Accel-Redirect from the backend.
    # /media/books/x.pdf  -> /srv/uploads/books/x.pdf
    # /media/audio/x.mp3  -> /srv/uploads/audio/x.mp3
    # /media/videos/x.mp4 -> /srv/uploads/videos/x.mp4
    location /media/ {
        internal;
        alias /srv/uploads/;
    }

    # Everything else -> the built SPA (frontend/dist), with index.html fallback for client-side routes.
    location / {
        root /srv/frontend;
        try_files $uri $uri/ /index.html;
    }
}
